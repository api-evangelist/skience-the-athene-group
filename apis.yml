name: Skience (The Athene Group)
description: Skience, a product of The Athene Group, is a wealth management technology
  company that delivers a Salesforce-based platform for firms undergoing digital transformation.
  Its platform serves broker-dealers, registered investment advisors (RIAs), and enterprise
  wealth management organizations with digital client and advisor onboarding, automated
  account opening, data management and aggregation, and advisor productivity tooling
  built natively on the Salesforce Financial Services Cloud ecosystem. Skience is backed
  by Insight Partners and operates as a private SaaS provider; it does not publish a
  public developer API, OpenAPI specification, or developer portal, but it does maintain
  a SafeBase-hosted trust center documenting SOC 2 Type 2 and SOC 2 + HITRUST attestations
  and a responsible disclosure program.
